<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 214" role="img" aria-labelledby="title desc">
<title id="title">MAX: One Graph Routine, Two GPU Kernels</title><desc id="desc">Progressive MLIR lowering from semantic operations to a routine, buffers, and two recorded GPU launches.</desc>
<style>
:root{--paper:#f7f9fc;--panel:#fff;--ink:#152234;--muted:#526276;--line:#cfdae5;--soft:#eaf0f6;--blue:#2260b0;--blue-soft:#e7f0ff;--teal:#086e66;--teal-soft:#dff4ee;--purple:#7753ab;--purple-soft:#f0eafa;--amber:#8a5a00;--amber-soft:#fcf0d6}
@media(prefers-color-scheme:dark){:root{--paper:#151d29;--panel:#1c2735;--ink:#e9eff8;--muted:#b1bfd0;--line:#43536a;--soft:#29374a;--blue:#8ebaff;--blue-soft:#213c60;--teal:#83d8c9;--teal-soft:#163e3b;--purple:#c9a9f5;--purple-soft:#392e4d;--amber:#f0c36a;--amber-soft:#463718}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:18px}
.title{font-size:25px;font-weight:650;letter-spacing:-.5px}.label{font-size:13px;letter-spacing:1.5px;fill:var(--muted);font-weight:600}.small{font-size:15px;fill:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:16px}.node-name{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;fill:var(--blue)}.node-shape{font-size:13px;fill:var(--muted)}.muted{fill:var(--muted)}.bold{font-weight:600}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.purple{fill:var(--purple)}
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="var(--muted)"/></marker></defs>
<rect width="1000" height="214" rx="18" fill="var(--paper)"/>

<text x="24" y="43" class="title" text-anchor="start">MAX: One Graph Routine, Two GPU Kernels</text>
<text x="24" y="84" class="label" text-anchor="start">CAPTURED LIBRARY PATH · tile_based_fusion=False</text>
<rect x="24" y="104" width="218" height="86" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="40" y="126" class="bold" text-anchor="start">1. Semantic (rmo)</text>
<text x="40" y="147" class="node-name" text-anchor="start">transpose → MatMul → add</text>
<text x="40" y="169" class="node-shape" text-anchor="start">Explicit [768, 1024] view</text>
<rect x="268" y="104" width="218" height="86" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="284" y="126" class="bold" text-anchor="start">2. Routine (mogg)</text>
<text x="284" y="147" class="node-name" text-anchor="start">mo.rebind #mo.layout&lt;NK&gt;</text>
<text x="284" y="169" class="node-shape" text-anchor="start">Grouped MatMul + bias</text>
<rect x="512" y="104" width="218" height="86" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="528" y="126" class="bold" text-anchor="start">3. Buffers (mgp)</text>
<text x="528" y="147" class="node-name" text-anchor="start">mgp.buffer.alloc (%8)</text>
<text x="528" y="169" class="node-shape" text-anchor="start">2 MiB FP16 + dispatch</text>
<rect x="756" y="104" width="220" height="86" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="772" y="126" class="bold" text-anchor="start">4. GPU Launches</text>
<text x="772" y="147" class="node-name" text-anchor="start">cuBLAS matrix → bias</text>
<text x="772" y="169" class="node-shape" text-anchor="start">2 kernels · no transpose</text>
<path d="M248 147L262 147" fill="none" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M492 147L506 147" fill="none" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M736 147L750 147" fill="none" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
