<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 398" role="img" aria-labelledby="title desc">
<title id="title">MAX Keeps Transpose, MatMul, and Add Explicit</title><desc id="desc">Value dependencies in the captured rmo graph. SSA names identify tensor values. The permutation constant and full type signatures are omitted; boxes are not GPU kernels.</desc>
<style>
:root{--paper:#f7f9fc;--panel:#fff;--ink:#152234;--muted:#526276;--line:#cfdae5;--soft:#eaf0f6;--blue:#2260b0;--blue-soft:#e7f0ff;--teal:#086e66;--teal-soft:#dff4ee;--purple:#7753ab;--purple-soft:#f0eafa}
@media(prefers-color-scheme:dark){:root{--paper:#151d29;--panel:#1c2735;--ink:#e9eff8;--muted:#b1bfd0;--line:#43536a;--soft:#29374a;--blue:#8ebaff;--blue-soft:#213c60;--teal:#83d8c9;--teal-soft:#163e3b;--purple:#c9a9f5;--purple-soft:#392e4d}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:18px}
.title{font-size:25px;font-weight:650;letter-spacing:-.5px}.label{font-size:13px;letter-spacing:1.5px;fill:var(--muted);font-weight:600}.small{font-size:15px;fill:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:16px}.node-name{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;fill:var(--blue)}.node-shape{font-size:13px;fill:var(--muted)}.muted{fill:var(--muted)}.bold{font-weight:600}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.purple{fill:var(--purple)}
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="var(--muted)"/></marker></defs>
<rect width="1000" height="398" rx="18" fill="var(--paper)"/>

<text x="24" y="43" class="title" text-anchor="start">MAX Keeps Transpose, MatMul, and Add Explicit</text>
<rect x="24" y="85" width="200" height="74" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="40" y="107" class="bold" text-anchor="start">Weight</text>
<text x="40" y="128" class="node-name" text-anchor="start">%arg1</text>
<text x="40" y="150" class="node-shape" text-anchor="start">[1024, 768] · FP16</text>
<rect x="300" y="85" width="280" height="74" rx="10" fill="var(--blue-soft)" stroke="var(--line)"/>
<text x="316" y="107" class="bold" text-anchor="start">Transpose</text>
<text x="316" y="128" class="node-name" text-anchor="start">rmo.mo.transpose → %2</text>
<text x="316" y="150" class="node-shape" text-anchor="start">[768, 1024] · FP16</text>
<rect x="660" y="85" width="200" height="74" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="676" y="107" class="bold" text-anchor="start">Bias b</text>
<text x="676" y="128" class="node-name" text-anchor="start">%arg2</text>
<text x="676" y="150" class="node-shape" text-anchor="start">[1024] · FP16</text>
<rect x="24" y="225" width="200" height="74" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="40" y="247" class="bold" text-anchor="start">Input x</text>
<text x="40" y="268" class="node-name" text-anchor="start">%arg0</text>
<text x="40" y="290" class="node-shape" text-anchor="start">[1024, 768] · FP16</text>
<rect x="300" y="225" width="280" height="74" rx="10" fill="var(--blue-soft)" stroke="var(--line)"/>
<text x="316" y="247" class="bold" text-anchor="start">MatMul</text>
<text x="316" y="268" class="node-name" text-anchor="start">rmo.matmul → %3</text>
<text x="316" y="290" class="node-shape" text-anchor="start">[1024, 1024] · FP16</text>
<rect x="660" y="225" width="316" height="74" rx="10" fill="var(--blue-soft)" stroke="var(--line)"/>
<text x="676" y="247" class="bold" text-anchor="start">Add bias</text>
<text x="676" y="268" class="node-name" text-anchor="start">rmo.add → %4</text>
<text x="676" y="290" class="node-shape" text-anchor="start">[1024, 1024] · FP16</text>
<path d="M234 122L290 122" fill="none" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M440 169L440 215" fill="none" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M234 262L290 262" fill="none" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M590 262L650 262" fill="none" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M760 169L760 215" fill="none" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="24" y="343" class="small" text-anchor="start">%2, %3, and %4 name the results of the corresponding operations in the excerpt.</text>
<text x="24" y="376" class="small" text-anchor="start">All tensors are placed on gpu:0. The f16 types alone do not describe internal accumulation precision.</text>
</svg>
