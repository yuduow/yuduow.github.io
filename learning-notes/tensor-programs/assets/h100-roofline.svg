<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">Two Compute Ceilings, One Memory Roof</title><desc id="desc">Schematic roofline on log-log axes. A memory roof rises with arithmetic intensity until it meets a compute ceiling. The Tensor Core ceiling used by the FP16-input matrix paths sits well above the scalar FP32 FFMA ceiling used by Luminal&#x27;s selected matrix path. A separate bias pass sits at very low intensity on the memory roof. No measured points are shown.</desc>
<style>
:root{--paper:#f7f9fc;--panel:#fff;--ink:#152234;--muted:#526276;--line:#cfdae5;--soft:#eaf0f6;--blue:#2260b0;--blue-soft:#e7f0ff;--teal:#086e66;--teal-soft:#dff4ee;--purple:#7753ab;--purple-soft:#f0eafa;--amber:#8a5a00;--amber-soft:#fcf0d6}
@media(prefers-color-scheme:dark){:root{--paper:#151d29;--panel:#1c2735;--ink:#e9eff8;--muted:#b1bfd0;--line:#43536a;--soft:#29374a;--blue:#8ebaff;--blue-soft:#213c60;--teal:#83d8c9;--teal-soft:#163e3b;--purple:#c9a9f5;--purple-soft:#392e4d;--amber:#f0c36a;--amber-soft:#463718}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:18px}
.title{font-size:25px;font-weight:650;letter-spacing:-.5px}.label{font-size:13px;letter-spacing:1.5px;fill:var(--muted);font-weight:600}.small{font-size:15px;fill:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:16px}.node-name{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;fill:var(--blue)}.node-shape{font-size:13px;fill:var(--muted)}.muted{fill:var(--muted)}.bold{font-weight:600}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.purple{fill:var(--purple)}
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="var(--muted)"/></marker></defs>
<rect width="1000" height="440" rx="18" fill="var(--paper)"/>

<text x="24" y="43" class="title" text-anchor="start">Two Compute Ceilings, One Memory Roof</text>
<text x="24" y="77" class="label" text-anchor="start">SCHEMATIC · LOG–LOG AXES · NOT TO SCALE · NO MEASURED POINTS</text>
<path d="M110 380L110 112" fill="none" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M110 380L962 380" fill="none" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="122" y="118" class="small" text-anchor="start">Attainable throughput</text>
<text x="958" y="368" class="small" text-anchor="end">Arithmetic intensity (operations per byte) →</text>
<path d="M110 370L600 150" fill="none" stroke="var(--ink)" stroke-width="2.5"/>
<path d="M600 150L960 150" fill="none" stroke="var(--teal)" stroke-width="3.5"/>
<path d="M355 260L960 260" fill="none" stroke="var(--amber)" stroke-width="3.5" stroke-dasharray="9 6"/>
<text x="620" y="138" class="bold" style="fill:var(--teal)">Tensor Core ceiling</text>
<text x="620" y="178" class="small" text-anchor="start">FP16-input matrix paths: Inductor, MAX, TinyGrad</text>
<text x="620" y="248" class="bold" style="fill:var(--amber)">Scalar FP32 FFMA ceiling</text>
<text x="620" y="288" class="small" text-anchor="start">Luminal&#x27;s selected matrix path</text>
<text x="140" y="250" class="bold" text-anchor="start">Memory roof</text>
<text x="140" y="272" class="small" text-anchor="start">bandwidth × intensity</text>
<path d="M170 380L170 352" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="170" cy="343" r="7" fill="var(--purple)"/>
<text x="124" y="410" class="small" style="fill:var(--purple)">● Separate bias pass (MAX, Luminal): about one add per output element</text>
<path d="M400 362L590 362" fill="none" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="400" y="350" class="small" text-anchor="start">Tile reuse raises matrix-kernel intensity</text>
</svg>
