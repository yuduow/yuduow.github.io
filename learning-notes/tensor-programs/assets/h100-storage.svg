<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">Logical Intermediate Traffic per Selected Path</title><desc id="desc">Horizontal stacked bars counting one write and one read per materialized intermediate. Inductor and TinyGrad have none. MAX has 4 MiB for its FP16 projection. Luminal has 24 MiB: 12 MiB for FP32 input copies, 8 MiB for the FP32 projection, and 4 MiB for the FP16 projection.</desc>
<style>
:root{--paper:#f7f9fc;--panel:#fff;--ink:#152234;--muted:#526276;--line:#cfdae5;--soft:#eaf0f6;--blue:#2260b0;--blue-soft:#e7f0ff;--teal:#086e66;--teal-soft:#dff4ee;--purple:#7753ab;--purple-soft:#f0eafa;--amber:#8a5a00;--amber-soft:#fcf0d6}
@media(prefers-color-scheme:dark){:root{--paper:#151d29;--panel:#1c2735;--ink:#e9eff8;--muted:#b1bfd0;--line:#43536a;--soft:#29374a;--blue:#8ebaff;--blue-soft:#213c60;--teal:#83d8c9;--teal-soft:#163e3b;--purple:#c9a9f5;--purple-soft:#392e4d;--amber:#f0c36a;--amber-soft:#463718}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:18px}
.title{font-size:25px;font-weight:650;letter-spacing:-.5px}.label{font-size:13px;letter-spacing:1.5px;fill:var(--muted);font-weight:600}.small{font-size:15px;fill:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:16px}.node-name{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;fill:var(--blue)}.node-shape{font-size:13px;fill:var(--muted)}.muted{fill:var(--muted)}.bold{font-weight:600}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.purple{fill:var(--purple)}
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="var(--muted)"/></marker></defs>
<rect width="1000" height="400" rx="18" fill="var(--paper)"/>

<text x="24" y="43" class="title" text-anchor="start">Logical Intermediate Traffic per Selected Path</text>
<text x="24" y="77" class="label" text-anchor="start">ONE WRITE + ONE READ PER MATERIALIZED INTERMEDIATE · NOT MEASURED HBM TRAFFIC</text>
<text x="24" y="126" class="bold" text-anchor="start">Inductor</text>
<text x="180" y="125" class="small" text-anchor="start">0 · projection stays inside the fused kernel</text>
<text x="24" y="184" class="bold" text-anchor="start">MAX</text>
<rect x="180" y="158" width="112" height="38" rx="6" fill="var(--teal-soft)" stroke="var(--teal)"/>
<text x="190" y="183" class="small" text-anchor="start">FP16 · 4</text>
<text x="306" y="184" class="bold" text-anchor="start">4 MiB</text>
<text x="24" y="242" class="bold" text-anchor="start">TinyGrad</text>
<text x="180" y="241" class="small" text-anchor="start">0 · projection stays inside the fused kernel</text>
<text x="24" y="300" class="bold" text-anchor="start">Luminal</text>
<rect x="180" y="274" width="336" height="38" rx="6" fill="var(--amber-soft)" stroke="var(--amber)"/>
<text x="190" y="299" class="small" text-anchor="start">FP32 input copies · 12</text>
<rect x="516" y="274" width="224" height="38" rx="6" fill="var(--blue-soft)" stroke="var(--blue)"/>
<text x="526" y="299" class="small" text-anchor="start">FP32 projection · 8</text>
<rect x="740" y="274" width="112" height="38" rx="6" fill="var(--teal-soft)" stroke="var(--teal)"/>
<text x="750" y="299" class="small" text-anchor="start">FP16 · 4</text>
<text x="866" y="300" class="bold" text-anchor="start">24 MiB</text>
<path d="M180 336L180 344" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
<text x="180" y="364" class="small" text-anchor="middle">0 MiB</text>
<path d="M404 336L404 344" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
<text x="404" y="364" class="small" text-anchor="middle">8 MiB</text>
<path d="M628 336L628 344" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
<text x="628" y="364" class="small" text-anchor="middle">16 MiB</text>
<path d="M852 336L852 344" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
<text x="852" y="364" class="small" text-anchor="middle">24 MiB</text>
<path d="M180 336L852 336" fill="none" stroke="var(--line)" stroke-width="1.5"/>
<text x="24" y="388" class="small" text-anchor="start">Excludes original input reads, bias, final output, repeated tile loads, and library workspace.</text>
</svg>
